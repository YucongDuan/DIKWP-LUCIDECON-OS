function validate(c){if(c.schema_version!=='2.0')throw Error('schema_version 2.0 required');if(!/^[A-Za-z0-9_.-]{1,80}$/.test(c.case_id))throw Error('Invalid case_id');dateOK(c.as_of);int(c.horizon_days,'horizon_days',1,365);const a=c.consent;dateOK(a.expires_on);bool(a.granted,'granted');bool(a.revoked,'revoked');if(!a.granted||a.revoked||a.expires_on<c.as_of||a.purpose!==c.purpose||a.owner_alias!==c.owner_alias)throw Error('Consent missing, expired, revoked or unbound');if(!['SYNTHETIC','USER_SUBMITTED'].includes(c.data_origin))throw Error('data_origin required');const r=c.resources;['spendable_cents','max_loss_cents','target_surplus_cents'].forEach(k=>int(r[k],k,0,1e9));int(r.available_minutes,'available_minutes',0,1e6);if(!c.opportunities.length||c.opportunities.length>30)throw Error('1..30 opportunities required');let ids=new Set();for(const e of c.evidence){if(ids.has(e.id))throw Error('Duplicate evidence ID');ids.add(e.id);dateOK(e.observed_on);dateOK(e.valid_until);int(e.sample_n,'sample_n',0,1e6);if(e.basis==='REVIEWED'&&!e.reviewer)throw Error('Reviewer required')}for(const o of c.opportunities){for(const k of ['lawful','data_consent','reversible','human_review'])bool(o.rights[k],k);const e=o.economics;if(e.currency!==r.currency)throw Error('Currency mismatch');['unit_price_cents','unit_cost_cents','acquisition_cents'].forEach(k=>pair(e[k],k));pair(e.demand_units,'demand_units',10000);['upfront_cents','fixed_period_cents'].forEach(k=>int(e[k],k,0,1e9));int(e.setup_minutes,'setup_minutes',0,1e6);int(e.delivery_minutes_per_unit,'delivery_minutes_per_unit',1,1e6);if(o.scenarios.length<2)throw Error('Two different scenarios required');let sig=new Set();for(const s of o.scenarios){['price_bps','demand_bps','cost_bps'].forEach(k=>int(s[k],k,0,30000));sig.add([s.price_bps,s.demand_bps,s.cost_bps].join('/'))}if(sig.size<2)throw Error('Scenario names do not create different assumptions');for(const a of o.routes){bool(a.authorized,'route.authorized');['cost_cents','latency_ms','egress_bytes'].forEach(k=>int(a[k],k,0,1e9));['quality_bps','reliability_bps'].forEach(k=>int(a[k],k,0,10000));if(a.energy)pair(a.energy.joules,'energy.joules',1e9)}}}
function route(o,resources){let g=o.route_gates,ok=o.routes.filter(a=>a.authorized&&a.data_classes.includes(g.data_class)&&a.quality_bps>=g.min_quality_bps&&a.reliability_bps>=g.min_reliability_bps&&a.cost_cents<=g.max_cost_cents&&a.latency_ms<=g.max_latency_ms&&a.egress_bytes<=g.max_egress_bytes&&(g.max_energy_j===null||(a.energy&&a.energy.boundary===g.energy_boundary&&a.energy.joules[1]<=g.max_energy_j)));let checks=[],filter='NOT_REQUESTED';if(resources){checks=ok.map(a=>{const rows=o.scenarios.map(s=>stress(o.economics,resources,s,a.cost_cents));return{id:a.id,worst:Math.min(...rows.map(x=>x.net_cash_cents[0])),best:Math.max(...rows.map(x=>x.net_cash_cents[1])),prefund:Math.max(...rows.map(x=>x.prefund_cents))}});const affordable=x=>x.prefund<=resources.spendable_cents&&x.worst>=-resources.max_loss_cents&&o.economics.setup_minutes<=resources.available_minutes;let robust=checks.filter(x=>affordable(x)&&x.worst>=resources.target_surplus_cents).map(x=>x.id),pilots=checks.filter(x=>affordable(x)&&x.best>=resources.target_surplus_cents).map(x=>x.id);if(robust.length){ok=ok.filter(a=>robust.includes(a.id));filter='ROBUST'}else if(pilots.length){ok=ok.filter(a=>pilots.includes(a.id));filter='PILOT'}else filter='DIAGNOSTIC'}let comparable=ok.filter(a=>a.energy&&a.energy.boundary===g.energy_boundary),pool=comparable.length?comparable:ok;pool.sort((a,b)=>((comparable.length?a.energy.joules[1]-b.energy.joules[1]:0)||a.cost_cents-b.cost_cents||a.latency_ms-b.latency_ms||a.egress_bytes-b.egress_bytes||a.id.localeCompare(b.id)));return pool[0]?{...pool[0],economic_checks:checks,economic_filter:filter}:null}
function stress(e,r,s,rc){let low=(x,f)=>Math.floor(x*f/10000),high=(x,f)=>Math.ceil(x*f/10000),price=[low(e.unit_price_cents[0],s.price_bps),high(e.unit_price_cents[1],s.price_bps)],cost=[low(e.unit_cost_cents[0]+e.acquisition_cents[0],s.cost_bps)+rc,high(e.unit_cost_cents[1]+e.acquisition_cents[1],s.cost_bps)+rc],cap=Math.floor(Math.max(0,r.available_minutes-e.setup_minutes)/e.delivery_minutes_per_unit),q=[Math.min(low(e.demand_units[0],s.demand_bps),cap),Math.min(high(e.demand_units[1],s.demand_bps),cap)],m=[price[0]-cost[1],price[1]-cost[0]],f=e.upfront_cents+e.fixed_period_cents,net=[Math.min(q[0]*m[0],q[1]*m[0])-f,Math.max(q[0]*m[1],q[1]*m[1])-f];return{scenario_id:s.id,net_cash_cents:net,prefund_cents:f+q[1]*cost[1],deliverable_units:q}}
function evaluate(c){validate(c);let results=[];for(const o of c.opportunities){let es=c.evidence.filter(e=>e.operations.includes(o.operation)&&e.basis==='REVIEWED'&&e.outcome==='PASS'&&e.sample_n>0&&e.observed_on<=c.as_of&&c.as_of<=e.valid_until),missing=['DEMAND','DELIVERY','ACCESS'].filter(k=>!es.some(e=>e.kind===k)).map(x=>'EVIDENCE_'+x);for(const r of o.required_roles)if(!es.some(e=>e.kind==='CAPABILITY'&&(e.roles||[]).includes(r)))missing.push('ROLE_'+r);let rt=route(o,c.resources),rows=o.scenarios.map(s=>stress(o.economics,c.resources,s,rt?rt.cost_cents:0)),worst=Math.min(...rows.map(s=>s.net_cash_cents[0])),best=Math.max(...rows.map(s=>s.net_cash_cents[1])),prefund=Math.max(...rows.map(s=>s.prefund_cents)),r=c.resources,rights=Object.values(o.rights).some(x=>!x),blocked=prefund>r.spendable_cents||worst < -r.max_loss_cents||o.economics.setup_minutes>r.available_minutes,status=rights?'BLOCKED_BY_RIGHTS':!rt?'NO_FEASIBLE_EXECUTION_ROUTE':missing.length?'INSUFFICIENT_EVIDENCE':Math.max(...rt.economic_checks.map(x=>x.best))<r.target_surplus_cents?'NO_CURRENT_PATH_IN_SCOPE':(blocked||rt.economic_filter==='DIAGNOSTIC')?'RESOURCE_BLOCKED':worst>=r.target_surplus_cents?'ROBUST_WITHIN_DECLARED_SCENARIOS':'BOUNDED_PILOT_ONLY';results.push({opportunity_id:o.id,title:o.title,status,summary:{worst_net_cents:worst,best_net_cents:best,prefund_cents:prefund,target_surplus_cents:r.target_surplus_cents},scenarios:rows,evidence_missing:missing,selected_route:rt?rt.id:null})}return{system:'LUCIDECON browser preview',version:'2.0.0',case_id:c.case_id,as_of:c.as_of,data_origin:c.data_origin,currency:c.resources.currency,results,empirical_validation:false,global_person_score:null,certificate:false}}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function hydrate(){let r=current.resources,e=current.opportunities[0].economics;$('budget').value=r.spendable_cents;$('target').value=r.target_surplus_cents;$('minutes').value=r.available_minutes;$('lowDemand').value=e.demand_units[0];$('json').value=JSON.stringify(current,null,2)}
function render(){let t=T[lang];for(const id of ['hero','sub','banner','inputTitle','sampleLabel','budgetLabel','targetLabel','minutesLabel','demandLabel','unitNote','run','reset','import','advanced','advancedNote','runJson','resultsTitle','export','exportInput','print','previewNote','guideTitle','g1t','g1','g2t','g2','g3t','g3','foot'])$(id).textContent=t[id];$('lang').textContent=lang==='zh'?'English':'中文';document.documentElement.lang=lang==='zh'?'zh-CN':'en';let saved=$('sample').value;$('sample').replaceChildren(...Object.keys(SAMPLES).map(k=>{let o=document.createElement('option');o.value=k;o.textContent=t.sampleNames[k];return o}));$('sample').value=saved||'ordinary-pilot';if(last)show(last)}
function show(a){let t=T[lang];$('results').innerHTML=`<span class="pill">${esc(t.origin)}: ${esc(a.data_origin)}</span>`+a.results.map(x=>{let warn=x.status==='ROBUST_WITHIN_DECLARED_SCENARIOS'?'':x.status.includes('NO_')||x.status==='BLOCKED_BY_RIGHTS'?'stop':'warn';return `<div class="status ${warn}"><strong>${esc(STATUS[x.status][lang==='zh'?0:1])}</strong><br><code>${esc(x.status)}</code></div><h3>${esc(x.title)}</h3><div class="metrics"><div class="small">${esc(t.worst)}<div class="metric">${(x.summary.worst_net_cents/100).toFixed(2)}</div>${esc(a.currency)}</div><div class="small">${esc(t.prefund)}<div class="metric">${(x.summary.prefund_cents/100).toFixed(2)}</div>${esc(a.currency)}</div></div><div class="tablewrap"><table><thead><tr><th>${t.scenario}</th><th>${t.units}</th><th>${t.cash}</th></tr></thead><tbody>${x.scenarios.map(s=>`<tr><td>${esc(s.scenario_id)}</td><td>${s.deliverable_units.join(' – ')}</td><td>${s.net_cash_cents.join(' … ')}</td></tr>`).join('')}</tbody></table></div><p class="small">${t.gap}: ${esc(x.evidence_missing.join(', ')||t.none)}<br>${t.rule}: ${esc(x.selected_route||'NONE')}</p>`}).join('')+`<p class="small">${esc(t.limit)}</p>`}
function run(){try{last=evaluate(current);$('error').textContent='';show(last)}catch(e){last=null;$('results').textContent='';$('error').textContent=e.message}}
function dl(name,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
