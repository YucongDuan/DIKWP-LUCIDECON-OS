[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikwp-lucidecon"
version = "2.0.0"
description = "Offline, evidence-scoped opportunity testing and exact contribution accounting"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yucong Duan"}]
dependencies = []

[project.scripts]
lucidecon = "lucidecon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
